name: Atlas checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint-test:
    name: Python lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_CACHE_DIR: ${{ runner.temp }}/atlas-uv-cache
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.0"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked Python environment
        run: make setup-python
      - name: Check lint and formatting
        run: make lint
      - name: Run tests
        run: make test

  build-data:
    name: Build empty data pipeline
    needs: lint-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_CACHE_DIR: ${{ runner.temp }}/atlas-uv-cache
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.0"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked Python environment
        run: make setup-python
      - name: Build and validate data artifacts
        run: make data
      - name: Pass validated publish artifacts to the site build
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: atlas-data-${{ github.sha }}
          path: data/publish/
          if-no-files-found: error
          retention-days: 7

  build-site:
    name: Build static site
    needs: build-data
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: atlas-data-${{ github.sha }}
          path: data/publish/
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install locked site dependencies
        run: make setup-site
      - name: Check and build the static site
        run: make site
      - name: Save local-preview build artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: atlas-site-${{ github.sha }}
          path: site/dist/
          if-no-files-found: error
          retention-days: 7

# Deployment is deliberately absent. Public deployment requires Raj's approval.
