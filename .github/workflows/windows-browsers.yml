name: Atlas Windows browsers

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-windows-browsers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-build:
    name: Build verified synthetic browser fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.23.4'
      - name: Install locked site dependencies
        working-directory: site
        run: npm ci --no-audit --no-fund
      - name: Compile synthetic pages and verify their stylesheets
        env:
          ATLAS_SYNTHETIC_BUNDLE: ${{ runner.temp }}/atlas-browser-fixture
        run: node site/scripts/check-build-modes.mjs --prepare-browser-bundle
      - name: Pass the synthetic fixture to Windows
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: synthetic-browser-fixture-${{ github.sha }}
          path: ${{ runner.temp }}/atlas-browser-fixture/
          if-no-files-found: error
          retention-days: 1

  windows-browsers:
    name: Windows Chrome and Edge on the compiled synthetic Atlas
    needs: synthetic-build
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.23.4'
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: synthetic-browser-fixture-${{ github.sha }}
          path: ${{ runner.temp }}/atlas-browser-fixture
      - name: Install locked browser driver
        working-directory: tools/browser-qa
        run: npm ci --no-audit --no-fund
      - name: Exercise the compiled pages in both installed Windows browsers
        env:
          ATLAS_SYNTHETIC_BUNDLE: ${{ runner.temp }}/atlas-browser-fixture
        run: node site/scripts/check-build-modes.mjs --prebuilt-windows
