name: Atlas Windows browsers

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-windows-browsers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-browsers:
    name: Windows Chrome and Edge on a synthetic Atlas
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.23.4'
      - name: Install locked site dependencies
        working-directory: site
        run: npm ci --no-audit --no-fund
      - name: Install locked browser driver
        working-directory: tools/browser-qa
        run: npm ci --no-audit --no-fund
      - name: Build synthetic routes and use both installed Windows browsers
        run: node site/scripts/check-build-modes.mjs --windows-browsers
