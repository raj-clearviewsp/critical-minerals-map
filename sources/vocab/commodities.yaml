schema_version: vocab-v1
kind: commodities
authority:
  source_id: usgs_critical_list_2025
  file: critical-minerals-list-2025.html
  list_year: 2025
  url: https://www.usgs.gov/news/science-snippet/interior-department-releases-final-2025-list-critical-minerals
notes:
- on_us_list means individually named on the official list; grouped REE/PGE labels are not list entries
  themselves.
- Rare-earth family follows the USGS NMIC 17-element definition (lanthanides, scandium and yttrium). Source-group
  totals retain their own definitions; individual elements are never inferred from a grouped REE total.
- Oxide aliases identify a commodity only. They do not convert oxide tonnage to elemental mass, sum grouped
  and individual quantities, or supply missing grades.
- Synonyms identify terminology; they do not establish a commodity is produced or a possible byproduct
  is certain. Source raw strings and qualifiers must be retained.
