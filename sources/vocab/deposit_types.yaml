schema_version: vocab-v1
kind: deposit_types
notes:
- Reviewed against work/vocab-geology-audit.json and work/vocab-tabular-audit.json on 2026-10-31. Source-specific
  synonyms reproduce encountered raw values, including whitespace and uncertainty marks.
- Mappings are conservative terminology groups, not resource, genetic-confidence or maturity determinations.
  Keep raw deposit type and source reference alongside the controlled code.
- Unknown is only an explicit source statement; unmatched strings remain in the unmapped report. No substring
  matching or blanket split of composite deposit types is authorized.
- Uncertainty marks such as (?) remain in raw aliases and must be retained as uncertainty annotations
  by the resolver. A matched code does not remove uncertainty.
- USGS laterites Subtype I/II/III oxide, Mg-silicate and clay-silicate combinations map only within that
  nickel-cobalt laterite source to the broad laterite type. They must not become ion-adsorption REE deposits.
- REE in clays, Li-Clay and Lithium clay are not ion-adsorption aliases. Commodity/mineral names, host
  rock alone, Non-pegmatite, mixed deposit models and unclear abbreviations remain unmapped unless explicitly
  reviewed here.
- Source-specific carbonatite and alkaline igneous labels with residual enrichment retain their primary
  named association; the enrichment qualifier remains raw. Tailings is a material context, distinct from
  a primary deposit model.
