  jasansky:
    primary_commodity:
      notes: Atomic facility primary-commodity field. Generic facility classes such as Other mine and
        Processing are not guessed into commodities.
    commodities_products:
      split: \s*,\s*
      values:
        Nickel-Cobalt Mixed Sulfide:
        - Ni
        - Co
      notes: This source uses comma lists of products; do not reuse this rule for MRDS commodity labels.
        Explicit product tokens may map to commodity associations, never converted masses or present operating
        status. Monazite is a rare-earth-bearing mineral form, not a claim of separated rare-earth production.
        Unknown industrial product tokens remain unmapped.
    commodity:
      split: ;
      notes: Preserve raw source text; tokenization identifies commodities, not quantities or production.
