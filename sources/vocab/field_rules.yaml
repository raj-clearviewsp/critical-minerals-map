schema_version: vocab-rules-v1
commodity_fields:
  usgs_global_ree:
    Commods:
      split: \s*,\s*
      values:
        REE. Nb:
        - REE
        - Nb
        Nb. REE:
        - Nb
        - REE
        Zr. REE:
        - Zr
        - REE
        Sn REE:
        - Sn
        - REE
      notes: Comma lists only. Exact value overrides must apply to the whole cell first and to individual
        tokens after splitting. Four explicitly reviewed punctuation/missing-delimiter tokens are expanded;
        no generic whitespace/dot splitting. Abbreviations_table gives Re=rhenium, P=phosphate, F=fluorite
        and Ba=barite. Unknown nonpilot tokens remain in the unmapped report. Qualifiers remain in raw
        evidence.
  usgs_us_critical:
    critmin:
      split: \s*,\s*
      notes: Comma-delimited commodity names; preserve raw cells, ignore empty split tokens only. Source
        rank/depcat are separate fields and do not assert present operation.
  usgs_global_critical:
    CRITICAL_MINERAL:
      split: \s*;\s*
      values:
        Niobium and Tantalum:
        - Nb
        - Ta
        Zirconium and Hafnium:
        - Zr
        - Hf
      notes: Only semicolons separate commodity categories. Retain compound source categories until explicit
        reviewed multi-code expansion; do not split every occurrence of and in generic fields.
  usgs_mrds:
    code_list:
      split: \s+
      notes: About.txt explicitly defines space-delimited source codes. Source code RE is Rhenium, REE
        is rare earths. Match source-qualified codes before any global casefolded alias.
    code:
      notes: Atomic Commodity.txt code; no delimiter splitting. NI_L/NI_R/NI_S are nickel categories and
        RE is rhenium.
    commod:
      notes: 'Atomic Commodity.txt name. NEVER comma-split: Nickel, Refiner and Nickel, Smelter are whole
        source categories. Mapping signifies commodity association, not evidence of current production.'
  usgs_laterites:
    Ni CutoffGrade%:
      values:
        Ni CutoffGrade%:
        - Ni
      notes: Header-origin observation, counted once. Identifies the column commodity only; zero/missing
        values do not establish a resource or byproduct for every record.
    Ni grade:
