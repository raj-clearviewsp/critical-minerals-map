notes:
- Pm is intentionally proposed per parent decision to include all17 rare-earth elements; add Pm entry
  if the current seed has not yet been updated. Sc belongs to REE family under that explicit decision.
- Value overrides must run on exact raw cells before splitting and on exact resulting tokens; this prevents
  malformed composite tokens from being lost while leaving unrelated unknown tokens visible.
- 'Never apply substring matching for pilot codes: COAL/COR are not cobalt; green and fired anode blocks
  is not REE.'
- Raw qualifiers such as (?) are retained independently of vocabulary resolution; aliasing a term does
  not resolve the geological uncertainty.
- FIPS Place identifiers and lateriteCountryCode are deliberately left to parent special-field policies.
  These override proposals concern explicit country-name fields only.
