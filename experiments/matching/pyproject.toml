[project]
name = "atlas-matching-experiment"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["splink>=4,<5", "rapidfuzz>=3,<4", "pandas>=2.2,<3", "pytest>=8,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["../.."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
