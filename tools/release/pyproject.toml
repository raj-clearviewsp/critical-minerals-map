[project]
name = "atlas-release-tools"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "shapely==2.1.2", "pyproj==3.7.2", "pandas==2.3.3", "pyarrow==23.0.1",
  "pandera[pandas]==0.35.0", "pycountry==26.2.16", "pyyaml==6.0.3", "jsonschema==4.26.0", "pytest==9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["../.."]
testpaths = ["tests"]
