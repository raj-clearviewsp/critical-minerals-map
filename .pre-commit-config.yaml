minimum_pre_commit_version: "4.0.0"

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint (locked environment)
        entry: uv run --locked ruff check
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: Ruff format check (locked environment)
        entry: uv run --locked ruff format --check
        language: system
        types_or: [python, pyi]
        require_serial: true
