[project]
name = "critical-minerals-atlas"
version = "0.0.1"
description = "Reproducible, provenance-first critical mineral reference"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pandas>=2.2,<3",
  "pyarrow>=19,<27",
  "pandera[pandas]>=0.26,<0.40",
  "jsonschema>=4.23,<5",
  "httpx>=0.28,<1",
  "pyyaml>=6,<7",
  "protego>=0.4,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<0.20", "pre-commit>=4,<5"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
